[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "automated-ml-pipeline"
version = "1.0.0"
description = "Production CLI for automated tabular and image classification"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "joblib>=1.2",
    "matplotlib>=3.6",
    "nbformat>=5.9",
    "numpy>=1.23",
    "openpyxl>=3.0",
    "pandas>=1.5",
    "psutil>=5.9",
    "scikit-learn>=1.2",
    "scipy>=1.9",
    "seaborn>=0.12",
    "xlrd>=2",
]

[project.optional-dependencies]
boosting = ["lightgbm>=4", "xgboost>=2"]
explain = ["shap>=0.42"]
images = [
    "peft>=0.10",
    "pillow>=10",
    "torch>=2",
    "tqdm>=4.66",
    "transformers>=4.40",
]
llm = ["litellm>=1", "python-dotenv>=1"]
dev = ["pytest>=8"]
all = [
    "lightgbm>=4",
    "litellm>=1",
    "peft>=0.10",
    "pillow>=10",
    "python-dotenv>=1",
    "shap>=0.42",
    "torch>=2",
    "tqdm>=4.66",
    "transformers>=4.40",
    "xgboost>=2",
]

[project.scripts]
ml-builder = "main:main"

[tool.setuptools]
py-modules = [
    "config",
    "data_cleaner",
    "data_loader",
    "dataset_embedding",
    "eda",
    "explainer",
    "feature_engineering",
    "feature_processing",
    "generalization",
    "backbone_selector",
    "image_splitting",
    "llm_explainer",
    "lora_adapter_trainer",
    "lora_config",
    "main",
    "model_selector",
    "model_trainer",
    "multimodal_extractor",
    "notebook_generator",
    "report_generator",
    "resource_manager",
    "vision_backbones",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
